[project]
name = "praxis-md"
version = "0.1.0"
description = "Science-focused task and knowledge manager — markdown + YAML as the organizing format."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
    "gitpython>=3.1",
    "cryptography>=42",
    "authlib>=1.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
